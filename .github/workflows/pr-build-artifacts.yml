name: Build PR Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

env:
  NODE_VERSION: "24.x"

jobs:
  check-permissions:
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    name: Check if user has write access
    runs-on: ubuntu-latest
    outputs:
      has-write-access: ${{ steps.check.outputs.require-result }}
    steps:
      - name: Check user permission
        id: check
        uses: actions-cool/check-user-permission@7b90a27f92f3961b368376107661682c441f6103
        with:
          require: write
          username: ${{ github.event.pull_request.user.login }}

  build:
    name: Build Windows installer
    needs: check-permissions
    if: needs.check-permissions.outputs.has-write-access == 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 11
          run_install: false

      - name: Setup NodeJS
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the x64 NSIS installer: the other Windows targets (web installer,
      # portable, ia32, arm64) and macOS/Linux builds aren't needed for PRs.
      - name: Build Windows installer
        run: |
          pnpm clean
          pnpm build
          pnpm exec electron-builder --win nsis:x64 -p never

      - name: Upload installer
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: windows-installer
          path: pack/*.exe
          retention-days: 7
          if-no-files-found: error

  comment:
    name: Comment on PR
    needs: [check-permissions, build]
    if: always() && needs.check-permissions.outputs.has-write-access == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Create comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const runId = context.runId;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const buildResult = '${{ needs.build.result }}';

            let comment;
            if (buildResult === 'success') {
              comment = `## 🚀 Build Artifacts Ready!

            The builds have completed successfully. You can download the artifacts from the workflow run:

            **[📦 Download Artifacts](${runUrl})**

            ### Available builds:
            - **Windows installer (x64)**: \`windows-installer\`

            *Note: Artifacts are available for 7 days.*`;
            } else if (buildResult === 'failure') {
              comment = `## ❌ Build Failed

            Unfortunately, the Windows build failed. Please check the workflow run for details:

            **[View Workflow Run](${runUrl})**`;
            } else {
              comment = `## ⚠️ Build Status: ${buildResult}

            The build process completed with status: **${buildResult}**

            **[View Workflow Run](${runUrl})**`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
